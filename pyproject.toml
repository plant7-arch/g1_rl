[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "g1_rl"
version = "0.1.0"
description = "End-to-end GPU RL pipeline (MJX + custom PPO) for Unitree G1 velocity-command walking"
requires-python = ">=3.10"
# Deliberately minimal: no flax / optax / brax / orbax. Networks, optimiser and
# checkpoints are plain JAX + NumPy so a checkpoint trained on Kaggle loads on
# any machine with only jax + numpy.
dependencies = [
  "jax>=0.6",
  "mujoco>=3.3.2",
  "mujoco-mjx>=3.3.2",
  "numpy",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.6"]
viz = ["mediapy", "imageio[ffmpeg]"]
export = ["onnx", "onnxruntime"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["g1_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
